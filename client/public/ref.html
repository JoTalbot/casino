<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Приглашение — Crown of Fortune</title>
<style>
body{font-family:system-ui,sans-serif;background:#070910;color:#dbe4f5;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
.card{background:#111725;border:1px solid #232c40;border-radius:12px;padding:24px;max-width:520px;width:100%}
button{padding:10px 20px;border:none;border-radius:6px;background:linear-gradient(180deg,#ffd257,#e0a92c);color:#241c05;font-weight:700;cursor:pointer;margin-top:8px}
.progress{height:10px;background:#0d1220;border:1px solid #232c40;border-radius:6px;overflow:hidden;margin:12px 0}
.bar{height:100%;width:0%;background:linear-gradient(90deg,#ffd257,#e0a92c);transition:width .4s}
.note{font-size:11px;color:#7f8da8}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
th,td{border-bottom:1px solid #161d2c;padding:6px;text-align:left}
</style>
</head>
<body>
<div class="card">
<h2>Тебя пригласили в Crown of Fortune!</h2>
<p>Виртуальные фишки без реальных денег, provably fair, 2 игры, турниры, чат. 18+</p>
<p>Код приглашения: <span id="code" style="font-family:monospace;background:#0d1220;padding:2px 6px;border-radius:4px"></span></p>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="progress-text" class="note">0/5 до мастера рефералов</div>
<button id="play">Играть и получить бонус 1000 CHIP</button>
<button id="share" style="background:#2a3346;color:#dbe4f5;margin-left:8px">Поделиться</button>
<div id="list" style="margin-top:12px;font-size:12px"></div>
<h3 style="font-size:13px;margin-top:16px">Топ рефереров</h3>
<div id="leaderboard" style="font-size:12px"></div>
<p style="font-size:11px"><a href="/" style="color:#7f8da8">← На главную</a> · <a href="/terms.html" style="color:#7f8da8">Правила</a></p>
</div>
<script>
const params = new URLSearchParams(location.search);
const ref = params.get('ref') || params.get('code') || '';
document.getElementById('code').textContent = ref || 'нет';
if(ref) localStorage.setItem('referral_code', ref);
document.getElementById('play').onclick = () => { if(ref) localStorage.setItem('referral_code', ref); location.href = '/'; };
document.getElementById('share').onclick = async () => {
  const link = `${location.origin}?ref=${ref || 'demo'}`;
  try { await navigator.clipboard.writeText(link); alert('Ссылка скопирована: '+link); }
  catch { prompt('Скопируй ссылку:', link); }
};
(async () => {
  try {
    const token = localStorage.getItem('casino_jwt')||'';
    if(!token) return;
    const res = await fetch('/api/v1/referrals/progress', { headers: { Authorization: `Bearer ${token}` } });
    if(!res.ok) return;
    const data = await res.json();
    document.getElementById('bar').style.width = `${Math.round(data.progress*100)}%`;
    document.getElementById('progress-text').textContent = `${data.count}/${data.target} до мастера, осталось ${data.remaining}`;
  } catch {}
})();
(async () => {
  try {
    const token = localStorage.getItem('casino_jwt')||'';
    if(!token) return;
    const res = await fetch('/api/v1/referrals', { headers: { Authorization: `Bearer ${token}` } });
    if(!res.ok) return;
    const data = await res.json();
    document.getElementById('list').innerHTML = '<b>Ты пригласил:</b><br>' + (data.referrals||[]).map(r=>`${r.username} +${r.bonus_amount} CHIP`).join('<br>') || 'пока никого';
  } catch {}
})();
(async () => {
  try {
    const res = await fetch('/api/v1/referrals/leaderboard?limit=10');
    if(!res.ok) return;
    const data = await res.json();
    const board = data.leaderboard||[];
    const el = document.getElementById('leaderboard');
    el.innerHTML = board.map(r=>`#${r.rank} ${r.username} — ${r.count} друзей, ${r.totalBonus} CHIP`).join('<br>') || 'пока пусто';
  } catch {}
})();
</script>
</body>
</html>
