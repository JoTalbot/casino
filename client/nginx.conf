server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Приложение отдаётся под тем же префиксом, что и снаружи (T-196):
    # /parts/casino/. Путь выбран не от красоты — на домене стоит
    # Cloudflare Access, и мимо него пропускается только /parts/*.
    # Слэш в конце alias обязателен, иначе nginx склеит путь неверно.
    location /parts/casino/api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /parts/casino/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    location = /parts/casino {
        return 301 /parts/casino/;
    }

    # Корень: тот же билд, ассеты подтягиваются по /casino/…
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси API к боевому бэкенду
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Верификатор статика (если соберём)
    location /verifier/ {
        alias /usr/share/nginx/html/verifier/;
        try_files $uri $uri/ =404;
    }

    # ToS/Privacy
    location = /terms.html { try_files $uri =404; }
    location = /privacy.html { try_files $uri =404; }
}
