# Оверлей для деплоя на ЗАНЯТЫЙ сервер (T-183).
#
# Зачем: базовый docker-compose.yml публикует порты на 0.0.0.0 — на общей
# машине это конфликтует с чужими сервисами и светит БД наружу.
# Этот файл всё прибивает к 127.0.0.1 и полностью убирает публикацию порта
# PostgreSQL: база доступна только контейнерам внутри compose-сети.
#
# Использование:
#   docker compose -p casino \
#     -f docker-compose.yml -f deploy/docker-compose.shared-host.yml up -d --build
#
# Внешний доступ выдаётся отдельно — reverse proxy на хосте или SSH-туннель:
#   ssh -L 8899:127.0.0.1:${CLIENT_PORT} root@<host>
services:
  db:
    # Порт наружу не публикуем вовсе
    ports: !reset []

  # !override обязателен: без него compose СКЛАДЫВАЕТ списки портов
  # с базовым файлом, контейнер пытается занять порт дважды и падает
  # с "address already in use" на заведомо свободном порту.
  # API наружу не публикуется никогда: клиентский nginx проксирует /api/
  # внутри compose-сети. Наружу при необходимости открывается только клиент.
  api:
    ports: !override
      - "127.0.0.1:${API_PORT:-3110}:3000"

  # CLIENT_BIND=0.0.0.0 открывает витрину наружу. По умолчанию — localhost.
  # Помните: docker publish обходит UFW через цепочку DOCKER-USER, поэтому
  # 0.0.0.0 делает порт доступным даже без правила ufw.
  client:
    ports: !override
      - "${CLIENT_BIND:-127.0.0.1}:${CLIENT_PORT:-8899}:80"
